[project]
name = "immich-compressor"
version = "1.0.0"
description = "Webhook-driven post-processing service that recompresses Immich assets out of band."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[project.scripts]
immich-compressor = "immich_compressor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/immich_compressor"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
exclude = [".venv", "testinstance", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # no print
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",
    "ASYNC",
    "BLE",       # blind except
    "S",         # bandit
]
ignore = [
    "S101",     # assert is fine in tests
    # Targets trio/anyio. We are on plain asyncio and only ever call stat()/exists()/
    # unlink() on local paths — sub-millisecond, not worth a thread hop.
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
"src/immich_compressor/__main__.py" = ["T20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: end-to-end tests that require a running Immich test instance (deselect with -m 'not live')",
]

[tool.pytest_asyncio]
asyncio_default_fixture_loop_scope = "function"
