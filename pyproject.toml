[project]
name = "immich-compressor"
dynamic = ["version"]
description = "Webhook-driven post-processing service that recompresses Immich assets out of band."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alois Krichmayr" }]
keywords = ["immich", "self-hosted", "ffmpeg", "transcoding", "hevc", "qsv", "vaapi", "nvenc", "photos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Conversion",
]
# There is no lockfile: the image installs with a plain `pip install .`, so these floors
# are the only thing standing between a build and a release nobody has run. They name the
# minor series CI actually exercises, which is also the oldest one that installs from
# wheels on every Python in the matrix — `pyyaml` first ships a cp314 wheel in 6.0.3, and
# `pydantic` only from 2.12 (pydantic-core 2.41). Anything older resolves fine on paper and
# then tries to compile C or Rust inside a slim image that has no compiler.
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "aiosqlite>=0.22",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Same rule as above, and one more reason: a contributor whose ruff predates CI's sees
# lint errors that do not exist, and pytest-asyncio changed its fixture loop scoping in
# 1.0 — the suite is written for the 1.x behaviour.
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
    "ruff>=0.16",
]

[project.scripts]
immich-compressor = "immich_compressor.__main__:main"

[project.urls]
Homepage = "https://github.com/Navilois/immich-compressor"
Source = "https://github.com/Navilois/immich-compressor"
Issues = "https://github.com/Navilois/immich-compressor/issues"
Changelog = "https://github.com/Navilois/immich-compressor/blob/main/CHANGELOG.md"

[build-system]
# 1.27 is the first release that understands the PEP 639 `license`/`license-files` keys.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Single source of truth for the version: `__version__` in the package itself, which is
# also what `immich-compressor --version` and the OCI image label report.
[tool.hatch.version]
path = "src/immich_compressor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/immich_compressor"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
exclude = [".venv", "testinstance", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # no print
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",
    "ASYNC",
    "BLE",       # blind except
    "S",         # bandit
]
ignore = [
    "S101",     # assert is fine in tests
    # Targets trio/anyio. We are on plain asyncio and only ever call stat()/exists()/
    # unlink() on local paths — sub-millisecond, not worth a thread hop.
    "ASYNC240",
]

[tool.ruff.format]
# Defaults, written out so nobody has to guess: the formatter is authoritative and
# `ruff format --check` runs in CI. Line length comes from [tool.ruff] above.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
# The CLI modules print by definition; everything else logs.
"src/immich_compressor/__main__.py" = ["T20"]
"src/immich_compressor/setup_cmd.py" = ["T20"]
"scripts/*.py" = ["T20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: end-to-end tests that require a running Immich test instance (deselect with -m 'not live')",
]

[tool.pytest_asyncio]
asyncio_default_fixture_loop_scope = "function"
