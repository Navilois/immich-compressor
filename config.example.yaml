# immich-compressor configuration.
#
# Secrets are NOT read from this file — they come from the environment only:
#   IMMICH__API_KEY   the Immich API key (x-api-key)
#   WEBHOOK__TOKEN    the shared secret; must equal `headerValue` in the workflow step
# Setting either of them here makes the service refuse to start.
#
# Any value below can also be overridden by an env var using `__` as the nesting
# separator, e.g. BEHAVIOR__DRY_RUN=false, IMMICH__BASE_URL=http://host:2283/api.

immich:
  base_url: http://immich-server:2283/api
  timeout_s: 120
  connect_timeout_s: 10

webhook:
  # Must match `headerName` in the workflow's webhook step.
  header_name: X-Compressor-Token

behavior:
  # ---- Shipping defaults: the service observes and reports, it changes nothing. ----
  dry_run: true            # true = download/encode nothing, upload nothing, delete nothing
  trash_original: false    # false = originals are never trashed, only reported
  # ---------------------------------------------------------------------------------

  retention_days: 7          # how long an original survives after being replaced; 0 = at once
  delete_mode: trash         # trash = soft delete, recoverable | permanent = gone for good
  initial_delay_seconds: 300 # let Immich finish thumbnails/ML/OCR before we touch the asset

  # ---- Reclaim disk space immediately (irreversible) -------------------------------
  # With these three, a verified original is force-deleted the moment its replacement
  # passes the four checks (replacement present and untrashed, checksum matches the
  # uploaded file, dateTimeOriginal set, compressor marker written). It bypasses the
  # trash, so `immich-compressor restore` cannot bring it back and the only rollback is
  # a backup of Postgres plus the upload directory. Uncomment only if you mean it.
  #
  #   trash_original: true
  #   retention_days: 0
  #   delete_mode: permanent
  # ---------------------------------------------------------------------------------
  concurrency: 1             # 2 vCPU box: one ffmpeg at a time
  max_attempts: 3
  poll_interval_seconds: 5

  # How many bytes a job has to actually save. Replaces the old `min_size_bytes`, which
  # guessed from the input size; this measures the outcome. It doubles as the free
  # pre-download filter: a file cannot save more bytes than it has, so an asset smaller
  # than this is rejected before the download, with no heuristic involved.
  min_savings_bytes: 1048576 # 1 MiB
  max_ratio: 0.6             # reject the result unless it is <= 60 % of the original
  enabled_types: [VIDEO, IMAGE]
  skip_if_named_people: true # never risk losing manually named faces

  # What happens when the post-encode metadata diff finds a tag the copy did not carry.
  #   strict — the job fails and the original is never touched (required with
  #            delete_mode: permanent, which the startup validation enforces)
  #   warn   — logged only; for the first days on unfamiliar camera material, and only
  #            defensible while delete_mode is 'trash' and the delete can be undone
  metadata_verify: strict

  duration_tolerance_s: 0.5
  require_same_resolution: true
  require_date_time_original: true

  work_dir: /var/tmp/immich-compressor
  free_space_factor: 3.0     # need 3x the source size free before starting

  compressed_marker: .cmp    # ends up in the filename AND in the workflow regex filter
  metadata_key: compressor   # asset-metadata KV key used as the idempotency marker

database_path: /var/lib/immich-compressor/state.db
listen_host: 0.0.0.0
listen_port: 8080
log_level: INFO

presets:
  # ---------------------------------------------------------------------------------
  # GPU encoding (Intel Quick Sync). Keep exactly ONE preset per type active — the first
  # match wins. Before switching, prove the hardware is actually usable:
  #
  #   docker compose exec immich-compressor vainfo --display drm --device /dev/dri/renderD128
  #     -> needs `VAProfileHEVCMain : VAEntrypointEncSlice` ("--display drm" is required
  #        on a headless host; plain vainfo tries X11 and fails for unrelated reasons)
  #   docker compose exec immich-compressor immich-compressor check
  #     -> encodes one frame through the preset's encoder and exits non-zero if it fails
  #
  # Chip generation decides the encoder. Debian trixie dropped libmfx1, so the legacy
  # MSDK path is gone: Gen12+ (Tiger Lake, Alder/Raptor Lake, N100, Arc) uses hevc_qsv,
  # Gen9-11 (<= 10th gen Core) has to use hevc_vaapi.
  #
  # video-h265-qsv:
  #   match: { type: VIDEO }
  #   cmd: >
  #     ffmpeg -y -loglevel error -noautorotate
  #     -hwaccel qsv -qsv_device /dev/dri/renderD128 -i {input}
  #     -map 0 -map_metadata 0 -movflags use_metadata_tags+faststart
  #     -c:v hevc_qsv -preset slower -global_quality 26
  #     -extbrc 1 -look_ahead_depth 40 -adaptive_i 1 -adaptive_b 1 -b_strategy 1
  #     -bf 3 -g 250 -tag:v hvc1
  #     -c:a copy
  #     {output}
  #   suffix: .mp4
  #   timeout_s: 3600
  #
  # Why these flags:
  #   -global_quality 26   ICQ, the QSV equivalent of CRF. Sweet spot for HEVC is 22-28.
  #                        Verify with scripts/calibrate.sh that the size actually reacts
  #                        to this number — in low-power (VDENC) mode some chips ignore
  #                        ICQ silently, and then you are calibrating against a constant.
  #   -extbrc 1            lookahead only takes effect with extended bitrate control;
  #                        -look_ahead_depth alone is a no-op.
  #   -preset slower       target usage 2. Nearly free on an iGPU: the fixed-function
  #                        block is the limit, not compute time.
  #   -c:a copy            re-encoding AAC to AAC is pure loss for no gain. Use
  #                        `-c:a aac -b:a 128k` only if your sources carry PCM audio.
  #   no -pix_fmt          8-bit sources produce Main, 10-bit/HDR sources produce Main10
  #                        automatically. Forcing 8 bit would flatten HDR without tone
  #                        mapping — washed out, and irreversible once the original is
  #                        gone. The sanity gate rejects that, but better not to ask.
  #   no -hwaccel_output_format qsv
  #                        frames go through system memory. Costs a few percent on an
  #                        iGPU and buys a software-decode fallback for sources the chip
  #                        cannot decode (MJPEG-AVI, old DivX, 10-bit VP9), which would
  #                        otherwise fail the job outright.
  #
  # Gen9-11 fallback. Note the missing `-map 0`: the filter chain does not survive extra
  # streams, so subtitle/data tracks are dropped here.
  # video-h265-vaapi:
  #   match: { type: VIDEO }
  #   cmd: >
  #     ffmpeg -y -loglevel error -noautorotate
  #     -hwaccel vaapi -hwaccel_device /dev/dri/renderD128 -i {input}
  #     -vf format=nv12|vaapi,hwupload
  #     -map_metadata 0 -movflags use_metadata_tags+faststart
  #     -c:v hevc_vaapi -rc_mode ICQ -global_quality 26 -bf 3 -g 250 -tag:v hvc1
  #     -c:a copy
  #     {output}
  #   suffix: .mp4
  #   timeout_s: 3600
  # ---------------------------------------------------------------------------------

  # `-threads 2` / `pools=2` matter: x265 sizes its thread pool from the host core
  # count and happily ignores a cgroup CPU limit, which starves everything else.
  #
  # `-noautorotate` is not cosmetic. Without it ffmpeg bakes the display matrix of a
  # portrait clip into the pixels and drops the matrix, so a 1920x1080+rot90 source comes
  # out as 1080x1920+rot0. The picture is fine, but the stored size changed — and with a
  # full-GPU pipeline (-hwaccel_output_format) the rotate filter cannot run at all,
  # because it does not accept hardware frames. Keeping the matrix avoids both.
  video-h265:
    match: { type: VIDEO }
    cmd: >
      ffmpeg -y -loglevel error -noautorotate -i {input}
      -map_metadata 0 -map 0 -movflags use_metadata_tags+faststart
      -c:v libx265 -preset medium -crf 26 -tag:v hvc1
      -x265-params pools=2 -threads 2
      -c:a aac -b:a 128k
      {output}
    suffix: .mp4
    timeout_s: 7200

  # ImageMagick, not cjpegli: Debian/Ubuntu package libjxl-tools WITHOUT the cjpegli
  # binary (0.11.2 in trixie ships only cjxl/djxl/jxlinfo), so the plan's `cjpegli`
  # preset cannot run on the stock image. See the README if you want to build libjxl
  # from source; then swap in the commented preset below.
  # `-strip` is deliberately absent — exiftool_copy restores metadata afterwards, but
  # keeping the ICC profile through the encode gives better colour.
  #
  # `-auto-orient` + `normalize_orientation` belong together and fix a real trap: for
  # HEIC the libheif decoder may already have applied the rotation, for JPEG it has not.
  # `-auto-orient` is idempotent and settles that either way; pinning Orientation to 1
  # afterwards stops exiftool from copying the source tag back onto pixels that are
  # already upright, which would rotate the image a second time.
  image-jpeg:
    # JPEG only, and an allowlist rather than a denylist. Immich files RAW, PNG, GIF,
    # TIFF and WebP under type IMAGE just like JPEG, and ImageMagick here reads DNG/CR2/
    # CR3/NEF/ARW through libraw — so without this list a RAW would be developed into an
    # 8-bit JPEG, pass every sanity check, and have its original deleted. HEIC is left
    # out for a different reason: it can only be written as JPEG here, and HEVC-intra
    # beats JPEG by roughly 2x, so the "compressed" file would be larger than the source.
    match:
      type: IMAGE
      extensions: [.jpg, .jpeg, .jpe, .jfif]
    cmd: magick {input} -auto-orient -quality 82 -interlace Plane {output}
    suffix: .jpg
    exiftool_copy: true          # a still loses ALL metadata on re-encode without this
    normalize_orientation: true  # requires -auto-orient above; validated at startup
    # A still costs about a second to encode, so the ratio is the wrong economic axis:
    # ratio 0.75 on a 12 MB photo saves 3 MB, ratio 0.60 on a 371 KB photo saves 147 KB.
    # max_ratio is therefore only a "something went badly wrong" net here, and
    # min_savings_bytes (from `behavior`) decides whether the result is worth keeping.
    max_ratio: 0.9
    # Off for stills on purpose: the replacement's timeline position comes from the
    # `fileCreatedAt` sent at upload and from the explicit `dateTimeOriginal` write in
    # step 8, not from the file. Requiring the tag would reject scans and EXIF-stripped
    # exports after a full download and encode, for no gain in correctness.
    require_date_time_original: false
    # Quantisation error is cumulative. Running a q78 source through a q82 preset costs a
    # second generation of artefacts and usually produces a *larger* file, so anything at
    # or below q85 is left alone.
    min_source_quality: 86
    timeout_s: 900

  # Why these flags:
  #   -quality 82          measured on two sources: ratio 0.38 on a detail-rich 4000x3000
  #                        camera JPEG, 0.60 on a flat 3000x2000 one. Verify against your
  #                        own material with `immich-compressor encode <file> --type IMAGE`.
  #   -interlace Plane     progressive JPEG. Free: it reorders the same DCT coefficients,
  #                        so the decoded pixels are bit-identical (verified with
  #                        `compare -metric AE` = 0) while the file shrinks 3-8 %.
  #   no -sampling-factor  ImageMagick then *inherits* the source's chroma subsampling
  #                        (verified: a 4:4:4 source stays 4:4:4 even at q82). Forcing
  #                        4:2:0 would halve chroma resolution on every 4:4:4 source —
  #                        visible on saturated edges, and no sanity check would notice.
  #   magick, not convert  `convert` is a deprecated alias in ImageMagick 7.

  # Requires a self-built libjxl >= 0.9. Keep only one IMAGE preset per extension set.
  # image-jpegli:
  #   match:
  #     type: IMAGE
  #     extensions: [.jpg, .jpeg]
  #   cmd: cjpegli {input} {output} -q 88
  #   suffix: .jpg
  #   exiftool_copy: true
