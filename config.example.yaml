# yaml-language-server: $schema=docs/config.schema.json
#
# immich-compressor — minimal configuration.
#
# This whole file is optional. Every value has a default, and the encoder is detected
# rather than configured, so an empty config.yaml is a working config.yaml.
# `immich-compressor setup` writes one tuned to your machine.
#
# Full reference: docs/configuration.md (generated from the code, so it cannot drift).
#
# Secrets are NOT read from this file — they come from the environment only:
#   IMMICH__API_KEY   the Immich API key
#   WEBHOOK__TOKEN    the shared secret; must equal `headerValue` in the workflow step
# Setting either of them here makes the service refuse to start.
#
# Any value below can also be overridden by an environment variable, with `__` as the
# nesting separator: BEHAVIOR__DRY_RUN=false, IMMICH__BASE_URL=http://host:2283/api.
# The environment wins over this file.

immich:
  # Reachable from inside the container. With both stacks on the same docker network this
  # is the Immich service name, not localhost.
  base_url: http://immich-server:2283/api

hardware:
  # auto | cpu | qsv | vaapi | nvenc — see docs/hardware.md.
  # `auto` enumerates the render nodes, asks ffmpeg and vainfo what they support, and
  # confirms the winner with a real one-frame encode. Run `immich-compressor hardware` to
  # see the choice it makes and every candidate it rejects.
  mode: auto
  render_node: auto

behavior:
  # ---- Shipping defaults: the service observes and reports, it changes nothing. ----
  dry_run: true            # true = download nothing, upload nothing, delete nothing
  trash_original: false    # false = originals are never removed, only reported
  delete_mode: trash       # trash = recoverable soft delete | permanent = gone for good
  # ---------------------------------------------------------------------------------
  # Read docs/safety.md before changing any of the three above. `permanent` is refused at
  # startup unless trash_original is true and dry_run is false.

  # The bulk-trigger gate. Refuse a webhook for an asset that was added to Immich longer
  # ago than this. The workflow trigger is `AssetMetadataExtraction`, and one click on
  # Administration -> Jobs -> Extract Metadata re-fires it for EVERY asset in the library;
  # this is what keeps that click from becoming a library-wide recompression. It reads the
  # payload's `createdAt`, which is the upload time and not the capture date, so importing
  # a thousand photos from 2009 still passes. A refused webhook writes no job, so the asset
  # stays reachable by `immich-compressor backfill` — the intentional way through a
  # library. `null` turns the gate off and is refused together with delete_mode: permanent.
  max_asset_age_hours: 24

  # The surge breaker: an OPT-IN backstop behind the gate above, for the bulk influx nobody
  # predicted. More than surge_threshold NEW assets queued from webhooks inside
  # surge_window_seconds latches the service paused — workers stop claiming, the sweeper
  # stops deleting, further webhooks are refused — until `immich-compressor resume --apply`.
  # The latch lives in the database, so restarting the container does not clear it.
  # Counted for webhook work only, so backfill and reprocess never trip it.
  #
  # Off by default: it counts assets and knows nothing else about them, so a first phone
  # backup or a camera card import looks exactly like the thing it exists to stop — and with
  # IMAGE in enabled_types an ordinary day is thousands of files, not tens. The gate above
  # is the guard that tells a re-trigger from an upload, and that one stays on.
  #
  # Set a number to turn it on. 2000 is a suggested starting point, not a measured one:
  # above one device's backlog, below a library migration.
  surge_threshold: null
  surge_window_seconds: 600

  # balanced | higher | smaller. Mapped per encoder to the right CRF / -global_quality /
  # -cq number. `balanced` is what this project shipped in 1.0.0.
  quality: balanced

  # Re-encode the audio to 128 kbit/s AAC when the container refuses to carry it as it is,
  # instead of failing the job. The video presets copy the audio stream, and MP4 has no
  # mapping for what an old camera AVI or a DVD rip carries (pcm_u8, amr_nb, pcm_dvd). Off:
  # it is a lossy conversion of a stream that was lossless, on a job that then deletes the
  # original. Only a run the container has already refused is retried.
  transcode_unsupported_audio: false

  retention_days: 7          # how long a replaced original survives; 0 = remove at once
  initial_delay_seconds: 300 # let Immich finish thumbnails/ML/OCR before touching an asset

  # How many bytes a job has to actually save. Replaces the old `min_size_bytes`, which
  # guessed from the input size; this measures the outcome. It doubles as the free
  # pre-download filter: a file cannot save more bytes than it has, so an asset smaller
  # than this is rejected before the download, with no heuristic involved.
  min_savings_bytes: 1048576 # 1 MiB
  max_ratio: 0.6             # reject the result unless it is <= 60 % of the original
  enabled_types: [VIDEO, IMAGE]  # drop IMAGE to leave stills alone
  skip_if_named_people: true # never risk losing manually named faces

  # What happens when the post-encode metadata diff finds a tag the copy did not carry.
  # Stills lose ALL metadata on re-encode and get it back from an exiftool copy, so this
  # is the gate that proves the copy worked.
  #   strict — the job fails and the original is never touched (required with
  #            delete_mode: permanent, which the startup validation enforces)
  #   warn   — logged only; for the first days on unfamiliar camera material, and only
  #            defensible while delete_mode is 'trash' and the delete can be undone
  metadata_verify: strict

# DEBUG, INFO, WARNING, ERROR or CRITICAL, in any case. Anything else is refused at
# startup: an unknown name used to become INFO here and then break `serve` inside uvicorn.
log_level: INFO

# presets:
#   Leave this out and the service builds the presets for you from the detected hardware —
#   an HEVC recipe for video and the ImageMagick JPEG recipe for stills.
#   Write it and it wins over everything: detection is skipped entirely, and `hardware.mode`
#   and `behavior.quality` no longer apply. That is what makes an upgrade from a
#   hand-written 1.0.0 config a no-op.
#
#   `immich-compressor hardware` prints the exact commands it would use, ready to paste.
#   The commented GPU presets that used to live here are in docs/hardware.md now, together
#   with the stills preset and the reason for every flag in it.
#
#   The stills preset carries a format allowlist (`match.extensions`), and it is not
#   optional: Immich files RAW, HEIC, PNG, GIF, TIFF and WebP under type IMAGE exactly like
#   JPEG, and ImageMagick reads DNG/CR2/CR3/NEF/ARW through libraw. Without the list a RAW
#   would be developed into an 8-bit JPEG, pass every sanity check, and lose its original.
