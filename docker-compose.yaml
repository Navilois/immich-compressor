# immich-compressor.
#
#   docker compose up -d
#
# `immich-compressor setup` writes the .env this file reads. Customise the deployment in
# docker-compose.override.yaml (compose loads it automatically) rather than here — see
# docker-compose.override.example.yaml.
#
# The service has to sit on the same docker network as your Immich stack, so the workflow
# webhook can reach it by name and it can reach immich-server the same way. Set
# IMMICH_NETWORK in .env to that network's name.
#
name: immich-compressor

services:
  immich-compressor:
    image: ghcr.io/navilois/immich-compressor:1
    container_name: immich-compressor
    restart: unless-stopped
    # The list form, because a bare name means "pass this through, but only if it is set".
    # A mapping cannot say that: `BEHAVIOR__DRY_RUN: ${BEHAVIOR__DRY_RUN:-}` would hand the
    # container an empty string on every deployment that does not set it.
    environment:
      # Secrets come from the environment only; never from config.yaml.
      - IMMICH__API_KEY=${IMMICH_API_KEY:?IMMICH_API_KEY is required — run `immich-compressor setup`}
      - WEBHOOK__TOKEN=${COMPRESSOR_TOKEN:?COMPRESSOR_TOKEN is required — run `immich-compressor setup`}
      - IMMICH__BASE_URL=${IMMICH_BASE_URL:-http://immich-server:2283/api}
      # The four flags .env may set, and the only ones it can: compose passes on what is
      # named here and nothing else. Left unset in .env they never reach the container at
      # all, so the shipped defaults stand — inert: nothing is uploaded, nothing deleted.
      # Going live is a change to .env, docker-compose.override.yaml or config.yaml, never
      # to this file. docs/safety.md walks through the four stages.
      - BEHAVIOR__DRY_RUN
      - BEHAVIOR__TRASH_ORIGINAL
      - BEHAVIOR__RETENTION_DAYS
      - BEHAVIOR__DELETE_MODE
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - compressor-state:/var/lib/immich-compressor
      - compressor-work:/var/tmp/immich-compressor

    # GPU encoding is opt-in through an overlay file — see the header of
    # docker-compose.gpu.yaml for why it cannot live here.

    # Sizing: leave Immich at least half the host's cores. The encoder reads this limit
    # from the container's own cgroup and pins its thread count to it, so raising `cpus`
    # is all you need to do — there is no second number to keep in sync.
    # A 4-core box: cpus 2. An 8-core box: cpus 4. Memory is per encode, not per core.
    cpus: ${COMPRESSOR_CPUS:-2}
    mem_limit: ${COMPRESSOR_MEMORY:-2g}
    pids_limit: 512

    # The image ships its own HEALTHCHECK (GET /healthz every 30s), so `docker compose ps`
    # reports healthy/unhealthy without anything here. Repeating it in this file would only
    # create a second copy to keep in sync.

    # No host port by default — Immich reaches the service over the shared network, and
    # /stats and /metrics are unauthenticated. Publish deliberately, never on 0.0.0.0:
    # ports:
    #   - '127.0.0.1:8080:8080'
    networks:
      - immich

networks:
  immich:
    external: true
    name: ${IMMICH_NETWORK:-immich_default}

volumes:
  compressor-state:
  compressor-work:
