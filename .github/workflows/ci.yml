name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default: nothing in CI needs to write to the repository.
permissions:
  contents: read

# One run per ref. A new push supersedes the one in flight instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: ruff check
        run: python -m ruff check --output-format=github .
      - name: ruff format
        run: python -m ruff format --check .

  language:
    name: English only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: German stopword guard
        run: ./scripts/check-language.sh

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Debian trixie, the same base the published image is built from, so the encoder tests
    # run against the ImageMagick and exiftool that users actually get. On the Ubuntu 24.04
    # runner they did not run at all: Ubuntu packages ImageMagick 6, which installs
    # `convert` but no `magick` binary, and exiftool 12.76, which predates the XMP-GCamera
    # namespace the motion-photo detection needs. Both guards skip instead of failing, so
    # CI reported a green "302 passed, 14 skipped" and nobody saw the hole.
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor from pyproject. 3.14 is what the published image runs, so it
        # belongs here too — an interpreter that ships to users and is not in the matrix is
        # an interpreter nobody tests.
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      # ffmpeg/ffprobe drive the video presets and the sanity gate, exiftool carries the
      # metadata across a still re-encode, and ImageMagick is the still encoder itself.
      - name: Media toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl imagemagick
          rm -rf /var/lib/apt/lists/*
      # A missing binary makes these tests skip rather than fail, which is exactly how they
      # went unnoticed. Assert the precondition instead of trusting a green summary line.
      - name: The toolchain the tests need is present
        run: |
          for tool in ffmpeg ffprobe exiftool magick identify; do
            command -v "$tool" >/dev/null \
              || { echo "::error::$tool is missing; encoder tests would skip silently"; exit 1; }
          done
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: pytest
        run: python -m pytest -m 'not live' -q

  docs:
    name: Generated docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      # Fails when docs/configuration.md or docs/config.schema.json no longer match the
      # settings model — which is the point of generating them.
      - name: gen_docs --check
        run: python scripts/gen_docs.py --check
      # Structural, offline: internal links and heading anchors only. External URLs are
      # not fetched, so CI never fails because somebody else's site is down.
      - name: Internal links resolve
        run: python scripts/check-links.py

  compose:
    name: Compose files
    runs-on: ubuntu-latest
    # The base file refuses to render without the two secrets, on purpose. Obvious
    # placeholders keep validation independent of any real deployment.
    env:
      IMMICH_API_KEY: placeholder
      COMPRESSOR_TOKEN: placeholder
      RENDER_GID: '993'
    steps:
      - uses: actions/checkout@v7
      # The test stack's services declare `env_file: testinstance/.env`, which is the
      # gitignored real one. Creating it from the template is the documented first step
      # anyway, so validating this way checks the instructions too.
      - name: Create the test instance env file
        run: cp testinstance/example.env testinstance/.env
      - name: Validate every overlay combination
        run: |
          docker compose -f docker-compose.yaml config -q
          docker compose -f docker-compose.yaml -f docker-compose.build.yaml config -q
          docker compose -f docker-compose.yaml -f docker-compose.gpu.yaml config -q
          docker compose -f docker-compose.yaml -f docker-compose.gpu-nvidia.yaml config -q
          docker compose -f docker-compose.yaml -f docker-compose.override.example.yaml config -q
          docker compose -f docker-compose.test.yaml --env-file testinstance/example.env config -q

  image:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Single arch here — the multi-arch build costs several minutes of emulation and
      # belongs in the release workflow, not on every pull request.
      - name: Build linux/amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: immich-compressor:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The built image can answer for itself
        run: |
          docker run --rm immich-compressor:ci --version
          docker run --rm immich-compressor:ci hardware --json > hardware.json
          python -c "import json,sys; d=json.load(open('hardware.json')); sys.exit(0 if d['presets'] else 1)"
