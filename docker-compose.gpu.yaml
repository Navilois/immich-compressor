# Optional overlay that hands the container an Intel or AMD GPU, for the *_qsv and
# *_vaapi presets.
#
#   RENDER_GID=$(getent group render | cut -d: -f3) \
#     docker compose -f docker-compose.yaml -f docker-compose.gpu.yaml up -d
#
# `immich-compressor setup` writes both RENDER_GID and
# COMPOSE_FILE=docker-compose.yaml:docker-compose.gpu.yaml into .env, after which a plain
# `docker compose up -d` picks this file up on its own.
#
# Deliberately not part of the base file: `devices:` pointing at a path the host does not
# have makes the container fail to start outright ("error gathering device information
# while adding custom device /dev/dri"). A CPU-only host could then not bring the service
# up at all, which is a much worse failure than not having hardware encoding.
#
# The container runs as uid 10001, so it also needs the host's render group — without it
# opening renderD128 fails with "Permission denied", which reads like a driver problem
# but is not. `immich-compressor hardware` says so explicitly when it happens.
#
# Intel and AMD both work through the same passthrough: the driver differs, the device
# does not. NVIDIA is different and lives in docker-compose.gpu-nvidia.yaml.

services:
  immich-compressor:
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?set RENDER_GID, e.g. RENDER_GID=$(getent group render | cut -d: -f3)}"
